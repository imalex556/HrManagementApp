<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recruitment Analytics</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        
        .navbar {
            background-color: #5cb85c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
        }
        
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            right: 0;
        }
        
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        
        .dropdown:hover .dropdown-content {
            display: block;
        }
        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .chart-container {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        
        .chart-title {
            color: #5cb85c;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .dropdown {
            margin-bottom: 20px;
        }
        
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        
        label {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .tooltip {
            position: absolute;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            font-size: 14px;
        }
        
        .no-data {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a th:href="@{/welcome}">Home</a>
        <div class="dropdown">
            <a class="dropbtn">Menu</a>
            <div class="dropdown-content">
                <a th:href="@{/profile}">Profile</a>
                <a th:href="@{/notifications}">Notifications</a>
                <a th:href="@{/}">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Recruitment Analytics</h1>
        
        <div class="dropdown">
            <label for="job-filter">Select Job:</label>
            <select id="job-filter" onchange="window.location.href = window.location.pathname + '?jobId=' + this.value">
                <option value="">All Jobs</option>
                <option th:each="job : ${hrJobs}"
                        th:value="${job.id}"
                        th:text="${job.get('title')}"
                        th:selected="${job.id == selectedJob}"></option>
            </select>
        </div>

        <div th:if="${hrJobs.empty}">
            <div class="no-data">
                No jobs posted yet. Analytics will be available after creating job postings.
            </div>
        </div>

        <div th:unless="${hrJobs.empty}">
            <div class="chart-container">
                <h2 class="chart-title">Application Funnel</h2>
                <div id="funnel-chart"></div>
            </div>
            
            <div class="chart-container">
                <h2 class="chart-title">Status Distribution</h2>
                <div id="status-chart"></div>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("opacity", 0);
        
        let recruitmentData = {
            funnel: {
                labels: ["Applied", "Shortlisted", "Interviewed", "Offered", "Hired"],
                values: [0, 0, 0, 0, 0],
                colors: ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f"]
            },
            statuses: []
        };

        function fetchData() {
            try {
                const dataFromBackend = JSON.parse(document.getElementById("analytics-data").textContent);
                recruitmentData = dataFromBackend;
            } catch(e) {
                console.error("Error parsing analytics data:", e);
            }
            
            drawFunnelChart();
            drawStatusChart();
        }

        function drawFunnelChart() {
            const margin = {top: 40, right: 30, bottom: 60, left: 60};
            const width = 800 - margin.left - margin.right;
            const height = 400 - margin.top - margin.bottom;
            
            d3.select("#funnel-chart").html("");
            
            const svg = d3.select("#funnel-chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const maxValue = d3.max(recruitmentData.funnel.values);
            const funnelWidth = width / recruitmentData.funnel.labels.length;
            
            recruitmentData.funnel.labels.forEach((label, i) => {
                const value = recruitmentData.funnel.values[i];
                const segmentHeight = height * (value / (maxValue || 1));
                const segmentWidth = funnelWidth * 0.8;
                
                svg.append("rect")
                    .attr("x", i * funnelWidth + (funnelWidth - segmentWidth)/2)
                    .attr("y", height - segmentHeight)
                    .attr("width", segmentWidth)
                    .attr("height", segmentHeight)
                    .attr("fill", recruitmentData.funnel.colors[i])
                    .on("mouseover", function(event) {
                        tooltip.transition()
                            .duration(200)
                            .style("opacity", .9);
                        tooltip.html(`${label}: ${value} applications`)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        tooltip.transition()
                            .duration(500)
                            .style("opacity", 0);
                    });
                    
                svg.append("text")
                    .attr("x", i * funnelWidth + (funnelWidth/2))
                    .attr("y", height - segmentHeight - 10)
                    .attr("text-anchor", "middle")
                    .text(`${label}: ${value}`);
                    
                if (i > 0) {
                    const prevValue = recruitmentData.funnel.values[i-1];
                    const conversion = prevValue > 0 ? (value / prevValue * 100).toFixed(1) : 0;
                    svg.append("text")
                        .attr("x", i * funnelWidth + (funnelWidth/2))
                        .attr("y", height - segmentHeight - 30)
                        .attr("text-anchor", "middle")
                        .text(`${conversion}%`);
                }
            });
            
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", -10)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .text("Application Funnel");
        }
        
        function drawStatusChart() {
            const margin = {top: 40, right: 30, bottom: 60, left: 60};
            const width = 800 - margin.left - margin.right;
            const height = 400 - margin.top - margin.bottom;
            
            d3.select("#status-chart").html("");
            
            const svg = d3.select("#status-chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
                
            const data = recruitmentData.statuses;
            const total = d3.sum(data, d => d.value) || 1;
            
            const x = d3.scaleBand()
                .range([0, width])
                .domain(data.map(d => d.name))
                .padding(0.2);
                
            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x))
                .selectAll("text")
                .attr("transform", "rotate(-45)")
                .style("text-anchor", "end");
                
            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value) || 1])
                .range([height, 0]);
                
            svg.append("g")
                .call(d3.axisLeft(y));

            svg.selectAll("bar")
                .data(data)
                .enter()
                .append("rect")
                .attr("x", d => x(d.name))
                .attr("y", d => y(d.value))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(d.value))
                .attr("fill", "#5cb85c")
                .on("mouseover", function(event, d) {
                    const percentage = ((d.value / total) * 100).toFixed(1);
                    tooltip.transition()
                        .duration(200)
                        .style("opacity", .9);
                    tooltip.html(`${d.name}: ${d.value} (${percentage}%)`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    tooltip.transition()
                        .duration(500)
                        .style("opacity", 0);
                });
                
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", -10)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .text("Application Status Distribution");
        }
        
        document.addEventListener("DOMContentLoaded", fetchData);
    </script>
    
    <div id="analytics-data" th:utext="${analyticsData}" style="display:none;"></div>
</body>
</html>
