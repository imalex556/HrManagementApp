<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Review History</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #5cb85c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            transition: background-color 0.3s ease;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: #5cb85c;
            color: white;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
			right: 0;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .review-card {
            background: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .joiner-name {
            color: #5cb85c;
            font-weight: bold;
        }

        .joiner-email {
            color: #666;
            font-size: 0.9em;
        }

        .review-date {
            color: #666;
            font-size: 0.9em;
        }

        .review-content {
            color: #333;
            line-height: 1.6;
        }

        .no-reviews {
            text-align: center;
            color: #666;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a th:href="@{/welcome}">Home</a>
        <div class="dropdown">
            <a class="dropbtn">Menu</a>
            <div class="dropdown-content">
                <a th:href="@{/profile}">Profile</a>
                <a th:href="@{/}">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="reviews-section">
            <h2>Your Submitted Reviews</h2>
            <div th:if="${not #lists.isEmpty(reviews)}">
                <div th:each="review : ${reviews}" class="review-card">
                    <div class="review-header">
                        <div>
                            <div class="joiner-name" th:text="${review.joinerName}"></div>
                            <div class="joiner-email" th:text="${review.joinerEmail}"></div>
                        </div>
                        <div class="review-date" th:text="${#dates.format(review.timestamp, 'dd MMM yyyy')}"></div>
                    </div>
                    <div class="review-content" th:text="${review.review}"></div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
                You haven't submitted any probation reviews yet.
            </div>
        </div>
    </div>
</body>
</html>
