<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HR Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #5cb85c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            transition: background-color 0.3s ease;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: #5cb85c;
            color: white;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .option-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .option-card:hover {
            transform: translateY(-5px);
        }

        .option-title {
            color: #5cb85c;
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .btn-primary {
            background-color: #5cb85c;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease;
            margin: 5px;
        }

        .btn-primary:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a th:href="@{/welcome}">Home</a>
        <div class="dropdown">
            <a class="dropbtn">Menu</a>
            <div class="dropdown-content">
                <a th:href="@{/profile}">Profile</a>
                <a th:href="@{/notifications}">Notifications</a>
                <a th:href="@{/}">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="options-grid">
            <div class="option-card">
                <h2 class="option-title">Job Postings</h2>
                <a th:href="@{/createJobPosting}" class="btn-primary">Create New</a>
                <a th:href="@{/viewJobs}" class="btn-primary">View All</a>
            </div>
            <div class="option-card">
                <h2 class="option-title">Applications</h2>
                <a th:href="@{/viewApplications}" class="btn-primary">View Applications</a>
                <a th:href="@{/selectJobForShortlistedApplications}" class="btn-primary">Shortlisted</a>
            </div>
			<div class="option-card">
                <h2 class="option-title">Tracking</h2>
                <a th:href="@{/candidateTrackingDashboard}" class="btn-primary">Candidate Tracking</a>
            </div>
            <div class="option-card">
                <h2 class="option-title">Interviews</h2>
                <a th:href="@{/viewInterviews}" class="btn-primary">Manage Interviews</a>
            </div>
			<div class="option-card">
			    <h2 class="option-title">Probation Reviews</h2>
			    <a th:href="@{/viewProbationReviews}" class="btn-primary">Manage Probations</a>
			</div>
        </div>
    </div>
</body>
</html>
