<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>View Job Postings</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #5cb85c;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      padding: 10px;
      transition: background-color 0.3s ease;
    }

    .navbar a:hover {
      background-color: #4cae4c;
    }

    .container {
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .job-listing {
      background-color: #fff;
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .job-title {
      font-size: 1.2em;
      font-weight: bold;
      color: #5cb85c;
    }

    .job-details {
      margin-top: 10px;
    }

    .job-details p {
      margin: 5px 0;
      color: #555;
    }

    .separator {
      border-top: 1px solid #ddd;
      margin: 10px 0;
    }

    .delete-button {
      background-color: #d9534f;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .delete-button:hover {
      background-color: #c9302c;
    }

    .notification-icon {
      position: relative;
      display: inline-block;
    }
    .notification-icon .badge {
      position: absolute;
      top: -10px;
      right: -10px;
      padding: 5px 10px;
      border-radius: 50%;
      background-color: red;
      color: white;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background-color: #5cb85c;
      color: white;
      padding: 10px 16px;
      border: none;
      cursor: pointer;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1;
	  right: 0;
    }
    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a th:href="@{/welcome}">Home</a>
    <div class="dropdown">
      <a class="dropbtn">Menu</a>
      <div class="dropdown-content">
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/notifications}" class="notification-icon">
          Notifications
          <span th:if="${notifications != null and #lists.size(notifications) > 0}" 
                class="badge" th:text="${#lists.size(notifications)}"></span>
        </a>
        <a th:href="@{/}">Logout</a>
      </div>
    </div>
  </div>
  <div class="container">
    <h2>Job Postings</h2>
    <div th:if="${jobPostings}">
      <div th:each="job : ${jobPostings}" class="job-listing">
        <div class="job-title" th:text="${job.get('title')}"></div>
        <div class="job-details">
          <p><strong>Company:</strong> <span th:text="${job.get('company')}"></span></p>
          <p><strong>Job Title:</strong> <span th:text="${job.get('title')}"></span></p>
          <p><strong>Location:</strong> <span th:text="${job.get('location')}"></span></p>
          <p><strong>Description:</strong> <span th:text="${job.get('description')}"></span></p>
          <p><strong>Posted By:</strong> <span th:text="${job.get('postedBy')}"></span></p>
          <div th:if="${job.get('postedBy')} == ${userEmail}">
            <form th:action="@{/deleteJob}" method="post">
              <input type="hidden" name="jobId" th:value="${job.id}">
              <button type="submit" class="delete-button">Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
