<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Signup</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 600;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus,
        select:focus {
            border-color: #5cb85c;
            box-shadow: 0 0 0 3px rgba(92,184,92,0.2);
            outline: none;
        }

        button[type="submit"] {
            background-color: #2c3e50;
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        button[type="submit"]:hover {
            background-color: #1a252f;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .message {
            color: #5cb85c;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #5cb85c;
            text-decoration: underline;
        }

        .team-field {
            display: none;
        }

        .required-asterisk {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Signup</h2>
        <div th:if="${message}" class="message">
            <p th:text="${message}"></p>
        </div>
        <form th:action="@{/signup}" method="post">
            <div class="form-group">
                <label for="email">Email: <span class="required-asterisk">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password: <span class="required-asterisk">*</span></label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password: <span class="required-asterisk">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <div class="form-group">
                <label for="name">Name: <span class="required-asterisk">*</span></label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="role">Role: <span class="required-asterisk">*</span></label>
                <select id="role" name="role" required>
                    <option value="HR_STAFF">HR Staff</option>
                    <option value="EMPLOYEE">Employee</option>
                    <option value="USER">User</option>
                </select>
            </div>
            <div class="form-group team-field">
                <label for="team">Team: <span class="required-asterisk">*</span></label>
                <input type="text" id="team" name="team">
            </div>
            <button type="submit">Signup</button>
        </form>
        <div class="login-link">
            <p>Already have an account? <a th:href="@{/login}">Login</a></p>
        </div>
    </div>
    <script>
        document.getElementById('role').addEventListener('change', function() {
            const role = this.value;
            const teamField = document.querySelector('.team-field');
            const teamInput = document.getElementById('team');

            if (role === 'EMPLOYEE') {
                teamField.style.display = 'block';
                teamInput.required = true;
            } else {
                teamField.style.display = 'none';
                teamInput.required = false;
            }
        });

        document.getElementById('role').dispatchEvent(new Event('change'));
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                event.preventDefault();
            }
            if (password.length < 6) {
                alert('Password must be at least 6 characters long.');
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
