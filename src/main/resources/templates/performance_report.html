<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Performance Report</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #5cb85c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            right: 0;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .report-content {
            white-space: pre-wrap;
            line-height: 1.6;
            margin: 20px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid #5cb85c;
        }
        .download-btn {
            background-color: #5cb85c;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .download-btn:hover {
            background-color: #4cae4c;
        }
        .joiner-info {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .joiner-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
	<div class="navbar">
	        <a th:href="@{/welcome}">Home</a>
	        <div class="dropdown">
	            <a class="dropbtn">Menu</a>
	            <div class="dropdown-content">
	                <a th:href="@{/profile}">Profile</a>
	                <a th:href="@{/notifications}">Notifications</a>
	                <a th:href="@{/}">Logout</a>
	            </div>
        </div>
    </div>

    <div class="container">
        <h2>Performance Report</h2>
        
        <div class="joiner-info">
            <p><strong>Name:</strong> <span th:text="${joiner.name}"></span></p>
            <p><strong>Team:</strong> <span th:text="${joiner.team}"></span></p>
            <p><strong>Position:</strong> <span th:text="${joiner.role}"></span></p>
        </div>
        
        <div class="report-content" th:text="${report}"></div>
        
        <a th:href="@{/downloadPerformanceReport(reportText=${report}, joinerName=${joiner.name})}" 
           class="download-btn">
            Download PDF Report
        </a>
    </div>
</body>
</html>
