<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome HR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
            overflow: hidden;
        }

        .animation-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .welcome-message {
            font-size: 2.5rem;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            opacity: 1;
            transform: translateY(0);
            transition: all 1s ease-in-out;
        }

        .welcome-message.hidden {
            opacity: 0;
            transform: translateY(-50px);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #5cb85c;
            margin-top: 10px;
            opacity: 1;
            transition: all 1s ease-in-out 0.2s;
        }

        .subtitle.hidden {
            opacity: 0;
            transform: translateY(-30px);
        }

        .loading-bar {
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, #2c3e50, #5cb85c);
            margin-top: 30px;
            border-radius: 2px;
            transition: width 2s ease-in-out 0.5s;
        }

        .loading-bar.complete {
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <div class="welcome-message">Welcome <span th:text="${name}"></span></div>
        <div class="subtitle">Redirecting you to the <span th:text="${dashboard}"></span></div>
        <div class="loading-bar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelector('.loading-bar').classList.add('complete');
            }, 100);

            setTimeout(() => {
                document.querySelector('.welcome-message').classList.add('hidden');
                document.querySelector('.subtitle').classList.add('hidden');
            }, 2000);

            setTimeout(() => {
                window.location.href = '/welcome_hr';
            }, 3000);
        });
    </script>
</body>
</html>
