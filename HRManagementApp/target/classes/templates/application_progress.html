<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Application Progress</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .navbar {
      background-color: #5cb85c;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar a {
      color: #fff;
      text-decoration: none;
      padding: 10px;
      transition: background-color 0.3s ease;
    }
    .navbar a:hover {
      background-color: #4cae4c;
    }
    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 600px;
      margin: 50px auto;
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    .application-listing {
      background-color: #fff;
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .application-title {
      font-size: 1.2em;
      font-weight: bold;
      color: #5cb85c;
    }
    .application-details {
      margin-top: 10px;
    }
    .application-details p {
      margin: 5px 0;
      color: #555;
    }
    .status {
      font-weight: bold;
    }
    .status.under-review {
      color: orange;
    }
    .status.next-stage {
      color: green;
    }
    .status.rejected {
      color: red;
    }
    .notification-icon {
      position: relative;
      display: inline-block;
    }
    .notification-icon .badge {
      position: absolute;
      top: -10px;
      right: -10px;
      padding: 5px 10px;
      border-radius: 50%;
      background-color: red;
      color: white;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background-color: #5cb85c;
      color: white;
      padding: 10px 16px;
      border: none;
      cursor: pointer;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1;
    }
    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      white-space: nowrap;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
    .take-test-button {
      background-color: #5cb85c;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }
    .take-test-button:hover {
      background-color: #4cae4c;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a th:href="@{/welcome}">Home</a>
    <div class="dropdown">
      <a class="dropbtn">Menu</a>
      <div class="dropdown-content">
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/notifications}" class="notification-icon">
          Notifications
          <span th:if="${notifications != null and #lists.size(notifications) > 0}" class="badge" th:text="${#lists.size(notifications)}"></span>
        </a>
        <a th:href="@{/}">Logout</a>
      </div>
    </div>
  </div>
  <div class="container">
    <h2>Application Progress</h2>
    <div th:if="${applications}">
      <div th:each="app : ${applications}" class="application-listing">
        <div class="application-title" th:text="${app.get('jobTitle')}"></div>
        <div class="application-details">
          <p><strong>Company:</strong> <span th:text="${app.get('companyName')}"></span></p>
          <p><strong>Status:</strong> <span th:text="${app.get('status')}" th:classappend="${app.get('statusClass')}"></span></p>
          <div th:if="${app.get('status') == 'Next Stage: Personality Test'}">
            <form th:action="@{/takePersonalityTest/neo}" method="get">
              <button type="submit" class="take-test-button">Take Personality Test</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
