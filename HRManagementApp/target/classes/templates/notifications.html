<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Notifications</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #5cb85c;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      padding: 10px;
      transition: background-color 0.3s ease;
    }

    .navbar a:hover {
      background-color: #4cae4c;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 600px;
      margin: 50px auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .notification-list {
      list-style-type: none;
      padding: 0;
    }

    .notification-item {
      background-color: #f8f8f8;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notification-item.unread {
      background-color: #f8d7da;
    }

    .notification-item p {
      margin: 0;
      color: #555;
    }

    .notification-actions {
      display: flex;
      align-items: center;
    }

    .notification-actions form {
      margin: 0 5px;
    }

    .notification-actions button {
      background-color: #5cb85c;
      color: #fff;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .notification-actions button:hover {
      background-color: #4cae4c;
    }

    .notification-actions .delete-button {
      background-color: #d9534f;
    }

    .notification-actions .delete-button:hover {
      background-color: #c9302c;
    }

    /* Dropdown Menu Styles */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background-color: #5cb85c;
      color: white;
      padding: 10px 16px;
      border: none;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      white-space: nowrap;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a th:href="@{/welcome}">Home</a>
    <div class="dropdown">
      <a class="dropbtn">Menu</a>
      <div class="dropdown-content">
        <a th:href="@{/profile}">Profile</a>
		<a th:href="@{/notifications}" class="notification-icon">
		    Notifications
		    <span th:if="${notifications != null and #lists.size(notifications) > 0}" class="badge" th:text="${#lists.size(notifications)}"></span>
		</a>
        </a>
        <a th:href="@{/}">Logout</a>
      </div>
    </div>
  </div>
  <div class="container">
      <h2>Notifications</h2>
      <ul class="notification-list">
        <li th:each="notification : ${notifications}" th:classappend="${notification.get('read') != null && notification.get('read')} ? '' : 'unread'" class="notification-item">
          <p th:text="${notification.get('message')}"></p>
          <div class="notification-actions">
            <form th:action="@{/markAsRead}" method="post">
              <input type="hidden" name="notificationId" th:value="${notification.id}">
              <button type="submit">Mark as Read</button>
            </form>
            <form th:action="@{/deleteNotification}" method="post">
              <input type="hidden" name="notificationId" th:value="${notification.id}">
              <button type="submit" class="delete-button">Delete</button>
            </form>
          </div>
        </li>
      </ul>
    </div>
  </body>
  </html>
