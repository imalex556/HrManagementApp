<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Select New Joiner</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #5cb85c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            transition: background-color 0.3s ease;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: #5cb85c;
            color: white;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .joiner-listing {
            background-color: #fff;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .joiner-info {
            flex-grow: 1;
        }

        .joiner-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #5cb85c;
        }

        .joiner-email {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .review-button {
            background-color: #5cb85c;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .review-button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a th:href="@{/welcome}">Home</a>
        <div class="dropdown">
            <a class="dropbtn">Menu</a>
            <div class="dropdown-content">
                <a th:href="@{/profile}">Profile</a>
                <a th:href="@{/}">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Select New Joiner for Review</h2>
        <div th:if="${newJoiners}">
            <div th:each="joiner : ${newJoiners}" class="joiner-listing">
                <div class="joiner-info">
                    <div class="joiner-name" th:text="${joiner.get('name')}"></div>
                    <div class="joiner-email" th:text="${joiner.get('email')}"></div>
                </div>
                <form th:action="@{/leaveReview}" method="get">
                    <input type="hidden" name="joinerId" th:value="${joiner.id}">
                    <button type="submit" class="review-button">Leave Review</button>
                </form>
            </div>
        </div>
        <div th:unless="${newJoiners}" class="no-joiners">
            No new joiners available in your team for review.
        </div>
    </div>
</body>
</html>
