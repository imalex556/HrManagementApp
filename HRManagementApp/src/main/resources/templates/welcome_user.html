<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Welcome User</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #5cb85c;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      padding: 10px;
      transition: background-color 0.3s ease;
    }

    .navbar a:hover {
      background-color: #4cae4c;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 400px;
      margin: 50px auto;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .link-group {
      margin-top: 20px;
    }

    .link-group a {
      display: block;
      background-color: #5cb85c;
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      text-decoration: none;
      margin-bottom: 10px;
      transition: background-color 0.3s ease;
    }

    .link-group a:hover {
      background-color: #4cae4c;
    }

    .notification-icon {
      position: relative;
      display: inline-block;
    }

    .notification-icon .badge {
      position: absolute;
      top: -10px;
      right: -10px;
      padding: 5px 10px;
      border-radius: 50%;
      background-color: red;
      color: white;
    }

    /* Dropdown Menu Styles */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background-color: #5cb85c;
      color: white;
      padding: 10px 16px;
      border: none;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      white-space: nowrap;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a th:href="@{/welcome}">Home</a>
    <div class="dropdown">
      <a class="dropbtn">Menu</a>
      <div class="dropdown-content">
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/notifications}" class="notification-icon">
          Notifications
          <span th:if="${#lists.size(notifications) > 0}" class="badge" th:text="${#lists.size(notifications)}"></span>
        </a>
		<a th:href="@{/}">Logout</a>
        
      </div>
    </div>
  </div>
  <div class="container">
    <h2>Welcome User</h2>
    <p>What would you like to do?</p>
    <div class="link-group">
      <a th:href="@{/viewJobsUser}">View Job Openings</a>
    </div>
  </div>
</body>
</html>
